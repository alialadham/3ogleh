<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cart | 3ogleh</title>
    <link rel="stylesheet" href="styles.css?v=4" />
  </head>
  <body>
    <script>try{if(sessionStorage.getItem("threeOglehLoaderShown")){document.documentElement.classList.add("loader-skip")}}catch(e){}</script>
    <div class="loading-screen" data-loading-screen>
      <div class="loading-overlay"></div>
      <div class="loading-content">
        <img src="assets/logo.png" alt="3ogleh logo" />
        <span>Powered by Brandak</span>
        <div class="loading-track"><div data-loading-bar></div></div>
      </div>
    </div>

    <header class="site-header">
      <a class="brand" href="/" aria-label="3ogleh home">
        <img src="assets/logo.png" alt="3ogleh logo" />
        <span><strong>3ogleh</strong><small>عقلة</small></span>
      </a>
      <nav class="nav-links nav-links-static">
        <a href="/#shop">Shop</a>
        <a href="/cart">Cart</a>
        <a href="/about">About</a>
        <a href="/#contact">Contact</a>
      </nav>
    </header>

    <main class="page-shell cart-page">
      <section class="page-hero">
        <h1>Your Cart</h1>
        <p>Review your selected 3ogleh equipment before checkout.</p>
      </section>

      <section class="cart-layout">
        <div>
          <div class="cart-items" id="cartItems"></div>
          <div class="empty-note" id="cartEmpty" hidden>
            Your cart is empty.
            <a href="/products#shop">Continue shopping</a>
          </div>
        </div>

        <aside class="order-card">
          <h2>Order Summary</h2>
          <div class="summary-row"><span>Subtotal</span><strong id="cartSubtotal">0 JOD</strong></div>
          <div class="summary-row total-row"><span>Total</span><strong id="cartTotal">0 JOD</strong></div>
          <a class="button button-primary" id="checkoutButton" href="/checkout">Go to checkout</a>
          <a class="button button-light" href="/products#shop">Continue shopping</a>
        </aside>
      </section>
    </main>

    <a class="floating-whatsapp" data-whatsapp-link href="https://wa.me/962798125254" target="_blank" rel="noreferrer" aria-label="Chat on WhatsApp">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16.04 3.2A12.74 12.74 0 0 0 5.18 22.6L3.8 28.8l6.34-1.32A12.78 12.78 0 1 0 16.04 3.2Zm0 2.28a10.5 10.5 0 0 1 8.91 16.05 10.45 10.45 0 0 1-13.98 3.73l-.45-.25-3.78.79.82-3.65-.29-.48A10.48 10.48 0 0 1 16.04 5.48Zm-5.1 5.55c-.24.53-.91 1.17-.91 2.22 0 1.05.94 3.04 2.2 4.45 1.5 1.69 3.7 3.02 5.72 3.7 1.51.51 2.26.44 3.05.28.94-.19 1.93-1.08 2.2-2.13.27-1.04.27-1.93.19-2.13-.08-.19-.29-.31-.61-.47l-2.13-1.04c-.32-.16-.55-.24-.78.08-.24.31-.9 1.04-1.1 1.25-.2.21-.41.24-.74.08-.32-.16-1.36-.5-2.6-1.6-.96-.86-1.61-1.92-1.8-2.24-.19-.32-.02-.5.14-.66.15-.14.32-.37.48-.55.16-.19.21-.32.32-.53.11-.21.05-.4-.03-.56l-.96-2.29c-.25-.61-.51-.53-.7-.54h-.6c-.21 0-.55.08-.84.4Z" fill="currentColor"/></svg>
    </a>

    <script src="/config.js"></script>
    <script src="shop-data.js"></script>
    <script src="loading.js"></script>
    <script src="cart.js"></script>
  </body>
</html>
